name: release-desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.1.10"
  push:
    tags:
      - "v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve and validate version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          # Production releases must come from the protected dev branch or an
          # already-pushed version tag. This prevents a manual dispatch from
          # publishing an arbitrary branch snapshot.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_REF" != "dev" ]; then
            echo "workflow_dispatch releases must run from the dev branch (got $RELEASE_REF)"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          BRAND_VERSION="$(node -p "require('./packages/chimera-brand/package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be strict SemVer without a leading v: $VERSION"
            exit 1
          fi
          if [ "$VERSION" != "$BRAND_VERSION" ]; then
            echo "Release version $VERSION does not match @chimera/brand $BRAND_VERSION"
            exit 1
          fi
          TAG="v${VERSION}"
          # A pushed tag is immutable for this workflow. On manual dispatch a
          # missing tag may be created by gh release create, but an existing
          # tag must point at this exact commit.
          if git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "$TAG points to $TAG_SHA, expected $GITHUB_SHA"
              exit 1
            fi
          elif [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Release tag $TAG could not be resolved from origin"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to mutate an existing release"
            exit 1
          fi
          gh release create "$TAG" \
            --title "Chimera Desktop ${TAG}" \
            --target "${{ github.sha }}" \
            --draft \
            --notes "$(cat <<EOF
          Chimera Desktop ${TAG}

          Key manager rename/delete plus status-bar switching, a session turn rail, bundled Noto Sans SC / JetBrains Mono, a prompt border that flows only while the session is live, and a Chimera overlay on the system prompt (including office skill examples). Built-in Excel, Word, PowerPoint, and PDF tools remain; designed decks use the bundled MIT ppt-master skill. OpenCode 1.18.21.

          ### Downloads
          - **Windows:** \`chimera-desktop-win-x64.exe\`
          - **macOS:** \`chimera-desktop-mac-arm64.dmg\` (Apple Silicon), \`chimera-desktop-mac-x64.dmg\` (Intel)
          - **Linux:** \`.AppImage\` / \`.deb\` / \`.rpm\` (x64 and arm64)

          macOS artifacts are signed and notarized for public release.

          ---

          密钥可重命名 / 删除，状态栏可切换；会话左侧有回合轨道；默认字体为 Noto Sans SC 与 JetBrains Mono；输入框流光仅在会话忙碌时出现。系统提示覆盖为 Chimera 身份与办公技能示例。内置表格 / Word / PPT / PDF 工具仍在；精美 PPT 走打包进安装包的 ppt-master（MIT）。上游 OpenCode 1.18.21。

          macOS 安装包已签名并完成公证。
          EOF
          )"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform_flag: --win --x64
            bun_install_flags: --os=win32 --cpu=x64
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux --x64
            bun_install_flags: --os=linux --cpu=x64
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
            bun_install_flags: --os=linux --cpu=arm64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    env:
      OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
      OPENCODE_CHANNEL: prod
      RUST_TARGET: ${{ matrix.target }}
      CSC_KEYCHAIN: build.keychain
      CHIMERA_REQUIRE_SIGNING: "true"
      APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Azure login
        if: runner.os == 'Windows'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.bun_install_flags }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Package
        working-directory: packages/desktop
        timeout-minutes: 60
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never --config electron-builder.config.ts

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS'
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="chimera-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="chimera-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chimera-desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.app.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/desktop/dist/latest*.yml
          if-no-files-found: warn

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: chimera-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - name: Upload desktop release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(/tmp/desktop/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} /tmp/desktop/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release assets found"
            ls -la /tmp/desktop || true
            exit 1
          fi
          gh release upload "v${{ needs.prepare.outputs.version }}" "${files[@]}" --clobber --repo "${{ github.repository }}"

      - name: Upload updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
          LATEST_YML_DIR: /tmp/latest-yml
        run: bun ./packages/desktop/scripts/finalize-latest-yml.ts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest
